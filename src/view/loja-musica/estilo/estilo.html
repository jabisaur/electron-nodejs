<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estilos | Empire Records</title>
    <link rel="stylesheet" href="../../../../node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../css/base.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid">
                <a class="navbar-brand" href="../index.html">
                    <i class="bi bi-disc"></i> Empire Records
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="../index.html">
                                <i class="bi bi-house-door"></i> Home
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="../cadastro/cadastro.html">
                                <i class="bi bi-plus-circle"></i> Cadastro
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="../buscar/buscar.html">
                                <i class="bi bi-search"></i> Busca
                            </a>
                        </li>
                        <li class="nav-item mb-2">
                            <a class="nav-link" href="../artista/artistaListar.html">
                                <i class="bi bi-people"></i> Lista de Artistas
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container mt-4">
        <div class="breadcrumb-container">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="../index.html">Home</a></li>
                    <li class="breadcrumb-item"><a href="../cadastro/cadastro.html">Cadastro</a></li>
                    <li class="breadcrumb-item active" aria-current="page"><i class="bi bi-music-note-beamed"></i> Estilos Musicais</li>
                </ol>
            </nav>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="page-title"><i class="bi bi-music-note-beamed"></i> Gerenciar Estilos</h1>
            <a href="../cadastro/cadastro.html" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Voltar</a>
        </div>

        <div class="card mb-4">
            <div class="card-header bg-primary text-white">
                <h2 class="h5 mb-0"><i class="bi bi-plus-circle"></i> Cadastrar Novo Estilo</h2>
            </div>
            <div class="card-body">
                <form id="form-estilo">
                    <div class="mb-3">
                        <label for="descricao" class="form-label">Nome do Estilo</label>
                        <input type="text" class="form-control" id="descricao" name="descricao" placeholder="Ex: Rock, Pop, Jazz..." autofocus required>
                    </div>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Salvar</button>
                </form>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-header bg-dark d-flex justify-content-between align-items-center">
                <h2 class="h5 mb-0"><i class="bi bi-list"></i> Estilos Cadastrados</h2>
                <span class="badge bg-info" id="totalEstilosCount">0 estilo(s)</span>
            </div>
            <div class="card-body position-relative">
                <div id="loadingOverlay" class="loading-overlay" style="display: none;">
                    <div class="loading-spinner-small"></div>
                </div>

                <div class="table-responsive">
                    <table class="table table-striped table-hover" id="lista-estilos">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Descrição</th>
                                <th style="width: 100px;">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-estilos">
                        </tbody>
                    </table>
                </div>

                <div class="paginacao mt-3">
                    <div class="resumo-resultados text-muted" id="resumoResultados">Mostrando 0-0 de 0 estilos</div>
                    <div class="d-flex gap-2">
                        <button class="btn-pagina" id="btnAnterior" onclick="paginaAnterior()" disabled>
                            <i class="bi bi-chevron-left"></i>
                        </button>
                        <span class="paginacao-info" id="paginacaoInfo">Página 1</span>
                        <button class="btn-pagina" id="btnProxima" onclick="proximaPagina()" disabled>
                            <i class="bi bi-chevron-right"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="edicaoEstiloModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Editar Estilo</h3>
                <button class="close-btn" onclick="fecharModalEdicao()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="valor-atual-info">
                    <strong>Nome Atual:</strong> <span id="valorAtualTexto" class="text-primary"></span>
                </div>
                <div class="form-group">
                    <label for="edicaoInput" class="form-label">Novo Nome:</label>
                    <input type="text" id="edicaoInput" class="form-control" placeholder="Digite o novo nome do estilo..." />
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="fecharModalEdicao()">Cancelar</button>
                <button class="btn btn-primary" id="edicaoBtnConfirmar">Salvar Alterações</button>
            </div>
        </div>
    </div>

    <script src="../../../../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="rendererEstilo.js"></script>
</body>
</html>
