<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador</title>
    <link rel="stylesheet" href="../../../node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/pages/contador.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid">
                <a class="navbar-brand" href="../loja-musica/index.html">
                    <i class="bi bi-disc"></i> Empire Records
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="../index.html">
                                <i class="bi bi-house-door"></i> Home
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="../versao/versoes.html"><i class="bi bi-info-circle"></i>
                                Versões</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="./contador.html"><i class="bi bi-123"></i> Contador</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="../calculadora/calculadora.html"><i class="bi bi-calculator"></i>
                                Calculadora</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container">
        <div class="contador-container">
            <div class="contador-card">
                <div class="contador-header">
                    <h1>
                        <i class="bi bi-123"></i>
                        Contador
                    </h1>
                    <p>Clique nos botões para interagir</p>
                </div>

                <div class="contador-body">
                    <!-- Display do contador -->
                    <div class="contador-display">
                        <div class="contador-valor" id="contador">0</div>
                        <div class="contador-label">CLIQUES</div>
                    </div>

                    <!-- Botões de ação -->
                    <div class="contador-acoes">
                        <button class="btn-contador btn-incrementar" id="incrementar">
                            <i class="bi bi-plus-circle"></i>
                            Incrementar
                        </button>
                        <button class="btn-contador btn-zerar" id="zerar">
                            <i class="bi bi-arrow-counterclockwise"></i>
                            Zerar
                        </button>
                    </div>

                    <!-- Estatísticas -->
                    <div class="contador-stats">
                        <div class="stat-card">
                            <div class="stat-icone">
                                <i class="bi bi-lightning-charge"></i>
                            </div>
                            <div class="stat-valor" id="total-cliques">0</div>
                            <div class="stat-label">Total de Cliques</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icone">
                                <i class="bi bi-calendar-day"></i>
                            </div>
                            <div class="stat-valor" id="sessao-cliques">0</div>
                            <div class="stat-label">Cliques na Sessão</div>
                        </div>
                    </div>
                </div>

                <div class="contador-footer">
                    <p>
                        <i class="bi bi-disc"></i>
                        Juliana Gabinio - Sistema Desktop com Electron
                        <i class="bi bi-disc"></i>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <script src="rendererContador.js"></script>
</body>
</html>
